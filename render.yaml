# Render Blueprint: https://render.com/docs/blueprint-spec
# Render reads this file when you create a Blueprint from the GitHub repo.
services:
  - type: web
    name: 2watch
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render asks for these when you create the Blueprint; they're never stored in git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
